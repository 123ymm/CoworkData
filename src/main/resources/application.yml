spring:
  application:
    name: CoworkData
  datasource:
    url: jdbc:postgresql://localhost:5432/coworkdata
    username: cowork
    password: cowork123
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

coworkdata:
  snapshot:
    keep: 3
    every-n-events: 50

# 身份迁移 POST /api/db/migrate-identity 调用 local-token 用；也可用环境变量 SUBSTRATE_BASE_URL
substrate:
  base-url: ${SUBSTRATE_BASE_URL:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleteAt
      logic-not-delete-value: "null"
      logic-delete-value: now()