spring:
  application:
    name: CoworkData
  datasource:
    url: jdbc:postgresql://localhost:5432/coworkdata
    username: cowork
    password: cowork123
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

coworkdata:
  snapshot:
    keep: 3
    every-n-events: 50

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleteAt
      logic-not-delete-value: "null"
      logic-delete-value: now()