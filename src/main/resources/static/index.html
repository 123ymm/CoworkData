<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoworkData 导出</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --ink: #1a1a1a;
      --muted: #5c6570;
      --btn: #0b6e4f;
      --btn-hover: #095c42;
      --btn-disabled: #9aab9f;
      --err: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, #d8e8e0 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 80%, #dde3ea 0%, transparent 50%),
        var(--bg);
    }
    main {
      text-align: center;
      padding: 2rem;
      max-width: 28rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0 0 1.75rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    #status {
      min-height: 1.4rem;
      margin: 0 0 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    #status.is-error { color: var(--err); }
    button {
      appearance: none;
      border: none;
      border-radius: 8px;
      padding: 0.85rem 1.6rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--btn);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    button:hover:not(:disabled) {
      background: var(--btn-hover);
    }
    button:active:not(:disabled) {
      transform: translateY(1px);
    }
    button:disabled {
      background: var(--btn-disabled);
      cursor: wait;
    }
  </style>
</head>
<body>
  <main>
    <h1>CoworkData</h1>
    <p>下载数据库全部业务表数据（ZIP 压缩包）</p>
    <p id="status" aria-live="polite"></p>
    <button type="button" id="btn">下载全部数据</button>
  </main>
  <script>
    (function () {
      var btn = document.getElementById("btn");
      var statusEl = document.getElementById("status");
      var pollTimer = null;

      function setStatus(text, isError) {
        statusEl.textContent = text || "";
        statusEl.className = isError ? "is-error" : "";
      }

      function resetBtn() {
        btn.disabled = false;
        btn.textContent = "下载全部数据";
      }

      function stopPoll() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      function pollJob(jobId) {
        fetch("/api/db/export-jobs/" + encodeURIComponent(jobId))
          .then(function (res) {
            if (!res.ok) {
              return res.text().then(function (t) {
                throw new Error(t || ("查询失败 HTTP " + res.status));
              });
            }
            return res.json();
          })
          .then(function (job) {
            if (job.status === "RUNNING") {
              setStatus(job.message || "导出进行中…");
              return;
            }
            stopPoll();
            if (job.status === "DONE") {
              setStatus("导出完成，开始下载…");
              window.location.href = "/api/db/export-jobs/" + encodeURIComponent(jobId) + "/file";
              resetBtn();
              return;
            }
            setStatus(job.message || "导出失败", true);
            resetBtn();
          })
          .catch(function (err) {
            stopPoll();
            setStatus(err.message || String(err), true);
            resetBtn();
          });
      }

      btn.addEventListener("click", function () {
        btn.disabled = true;
        btn.textContent = "导出中…";
        setStatus("正在创建导出任务…");
        stopPoll();

        fetch("/api/db/export-jobs", { method: "POST" })
          .then(function (res) {
            if (res.status === 429) {
              throw new Error("已有导出任务在执行，请稍后再试");
            }
            if (!res.ok) {
              return res.text().then(function (t) {
                throw new Error(t || ("创建失败 HTTP " + res.status));
              });
            }
            return res.json();
          })
          .then(function (job) {
            setStatus(job.message || "导出进行中…");
            pollJob(job.jobId);
            pollTimer = setInterval(function () {
              pollJob(job.jobId);
            }, 2000);
          })
          .catch(function (err) {
            setStatus(err.message || String(err), true);
            resetBtn();
          });
      });
    })();
  </script>
</body>
</html>
