<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoworkData 导出</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --ink: #1a1a1a;
      --muted: #5c6570;
      --btn: #0b6e4f;
      --btn-hover: #095c42;
      --btn-disabled: #9aab9f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, #d8e8e0 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 80%, #dde3ea 0%, transparent 50%),
        var(--bg);
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0 0 1.75rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 8px;
      padding: 0.85rem 1.6rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--btn);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    button:hover:not(:disabled) {
      background: var(--btn-hover);
    }
    button:active:not(:disabled) {
      transform: translateY(1px);
    }
    button:disabled {
      background: var(--btn-disabled);
      cursor: wait;
    }
  </style>
</head>
<body>
  <main>
    <h1>CoworkData</h1>
    <p>下载数据库全部业务表数据（ZIP 压缩包）</p>
    <button type="button" id="btn">下载全部数据</button>
  </main>
  <script>
    (function () {
      var btn = document.getElementById("btn");
      btn.addEventListener("click", function () {
        btn.disabled = true;
        window.location.href = "/api/db/export-all";
        setTimeout(function () {
          btn.disabled = false;
        }, 2000);
      });
    })();
  </script>
</body>
</html>
